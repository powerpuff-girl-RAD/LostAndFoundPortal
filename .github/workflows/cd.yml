name: CD — Deploy to GitHub Pages (Blue-Green)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      rollback:
        description: "Rollback to previous deployment? (yes/no)"
        required: false
        default: "no"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages-deployment"
  cancel-in-progress: false

defaults:
  run:
    working-directory: LostFoundPortal

jobs:
  # ─────────────────────────────────────────────
  # GATE — Only proceed if CI passed
  # ─────────────────────────────────────────────
  gate:
    name: CI Gate Check
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}

    steps:
      - name: Resolve commit SHA
        id: resolve
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          else
            echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Confirm CI succeeded
        working-directory: ${{ github.workspace }}
        run: echo "CI passed for ${{ steps.resolve.outputs.sha }} — proceeding with Blue-Green deploy"

  # ─────────────────────────────────────────────
  # BLUE — Build new version
  # ─────────────────────────────────────────────
  build-blue:
    name: Build Blue (new version)
    runs-on: ubuntu-latest
    needs: gate
    if: github.event.inputs.rollback != 'yes'

    steps:
      - name: Checkout code at resolved SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"
          cache-dependency-path: LostFoundPortal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application (Vite — Blue)
        run: npm run build
        env:
          BASE_URL: /UniLostAndFoundPortal/
          VITE_DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
          VITE_DEPLOY_RUN: ${{ github.run_id }}

      - name: localStorage schema version check
        run: |
          echo "Checking for localStorage schema version marker..."
          grep -r "APP_SCHEMA_VERSION\|schemaVersion\|schema_version" dist/ \
            && echo "Schema version marker found ✅" \
            || echo "⚠ Warning: No schema version marker — ensure localStorage migrations are handled on app init"
        continue-on-error: true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Blue artifact (GitHub Pages format)
        uses: actions/upload-pages-artifact@v3
        with:
          # Must be repo-root-relative
          path: LostFoundPortal/dist/

  # ─────────────────────────────────────────────
  # VALIDATE — Smoke-test Blue before cut-over
  # ─────────────────────────────────────────────
  validate-blue:
    name: Validate Blue (smoke test)
    runs-on: ubuntu-latest
    needs: [gate, build-blue]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"
          cache-dependency-path: LostFoundPortal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Rebuild for local smoke test
        run: npm run build
        env:
          BASE_URL: /

      - name: Serve Blue and run smoke tests
        run: |
          npx serve -s dist -l 3001 &
          SERVER_PID=$!
          sleep 5

          echo "=== Smoke Test 1: HTTP 200 ==="
          curl -sf http://localhost:3001/ && echo "✅ App loads" \
            || (echo "❌ App failed to load" && kill $SERVER_PID && exit 1)

          echo "=== Smoke Test 2: index.html present ==="
          curl -sf http://localhost:3001/index.html && echo "✅ index.html OK" \
            || echo "⚠ index.html check skipped (SPA may serve from /)"

          echo "=== Smoke Test 3: JS assets present ==="
          JS_COUNT=$(find dist/assets -name "*.js" 2>/dev/null | wc -l)
          echo "JS assets found: $JS_COUNT"
          [ "$JS_COUNT" -gt 0 ] && echo "✅ JS assets OK" || (echo "❌ No JS assets" && kill $SERVER_PID && exit 1)

          kill $SERVER_PID
          echo "All smoke tests passed ✅"

      - name: Validate success criteria (Lighthouse)
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:3001
          budgetPath: "LostFoundPortal/.lighthouserc.json"
          temporaryPublicStorage: true
        continue-on-error: true

      - name: Core Web Vitals check summary
        working-directory: ${{ github.workspace }}
        run: |
          echo "=== Success Criteria for Progressive Rollout ==="
          echo "LCP  < 2.5s   — enforced via .lighthouserc.json"
          echo "CLS  < 0.1    — enforced via .lighthouserc.json"
          echo "TBT  < 300ms  — enforced via .lighthouserc.json"
          echo "Perf >= 90    — enforced via .lighthouserc.json"
          echo "A11y >= 90    — enforced via .lighthouserc.json"

  # ─────────────────────────────────────────────
  # CUT-OVER — Atomically swap Green → Blue
  # ─────────────────────────────────────────────
  deploy-production:
    name: Cut-over (Green → Blue)
    runs-on: ubuntu-latest
    needs: [gate, validate-blue]
    if: github.event.inputs.rollback != 'yes'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Blue to production
        id: deployment
        uses: actions/deploy-pages@v4
        # GitHub Pages atomically replaces the live site.
        # Previous deployment is retained → rollback = re-run last good workflow.
        # RTO: < 1 minute.

      - name: Deployment summary
        working-directory: ${{ github.workspace }}
        run: |
          echo "## Deployment Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| URL | ${{ steps.deployment.outputs.page_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ needs.gate.outputs.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Strategy | Blue-Green (atomic Pages swap) |" >> $GITHUB_STEP_SUMMARY
          echo "| RTO | < 1 min — re-run last successful workflow |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> To rollback: trigger this workflow manually with \`rollback: yes\`" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────
  # POST-DEPLOY — Health check 60s after cut-over
  # ─────────────────────────────────────────────
  post-deploy-monitor:
    name: Post-Deploy Monitor
    runs-on: ubuntu-latest
    needs: deploy-production

    steps:
      - name: Wait for CDN propagation then health-check
        working-directory: ${{ github.workspace }}
        run: |
          echo "Waiting 60s for CDN propagation..."
          sleep 60

          PROD_URL="https://${{ github.repository_owner }}.github.io/UniLostAndFoundPortal"
          echo "Health-checking: $PROD_URL"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL" || echo "000")
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Production health check passed"
          else
            echo "⚠ Production returned HTTP $HTTP_STATUS"
            echo "### ⚠ Health Check Warning" >> $GITHUB_STEP_SUMMARY
            echo "Production returned HTTP \`$HTTP_STATUS\` — consider rolling back." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post-deploy monitoring checklist
        working-directory: ${{ github.workspace }}
        run: |
          echo "### Post-Deploy Monitoring Checklist" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Sentry error rate < 0.5% (5-min window)" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] LCP < 2.5s on production URL" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] No QuotaExceededError in Sentry (localStorage saturation)" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] localStorage schema migration ran cleanly for existing users" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Monitor for 30 min before closing deployment ticket" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────
  # ROLLBACK — Re-deploy previous artifact
  # Trigger: workflow_dispatch with rollback=yes
  # ─────────────────────────────────────────────
  rollback:
    name: Rollback (Blue → Green)
    runs-on: ubuntu-latest
    if: github.event.inputs.rollback == 'yes'
    needs: gate

    environment:
      name: github-pages

    steps:
      - name: Rollback instructions
        working-directory: ${{ github.workspace }}
        run: |
          echo "## ⏪ Rollback Initiated" >> $GITHUB_STEP_SUMMARY
          echo "**RTO: < 1 minute**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Steps to complete rollback:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to Actions → CD workflow" >> $GITHUB_STEP_SUMMARY
          echo "2. Find the last **successful** run before this incident" >> $GITHUB_STEP_SUMMARY
          echo "3. Click Re-run jobs → GitHub Pages atomically swaps back" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Alternative: \`git revert <merge-commit-sha>\` and push to main" >> $GITHUB_STEP_SUMMARY

